name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:23 UTC: catches new queries against unchanged code.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - tests
              - benchmarks
              - paper
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:python
