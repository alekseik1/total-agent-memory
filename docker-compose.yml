# total-agent-memory — Full Docker Stack
#
# Services:
#   ollama       — local LLM runtime (qwen2.5-coder:7b + nomic-embed-text)
#   model-init   — one-shot job that pulls the required Ollama models
#   mcp          — MCP server over HTTP (streamable) on :3737
#   dashboard    — web UI on :37737
#   reflection   — daemon: file-watch drain of reflection queues
#   scheduler    — cron-like jobs (orphan-backfill 4×/day, check-updates weekly)
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down           # keep data volumes
#   docker compose down -v        # wipe everything
#
# After `up -d`: run `bash install-docker.sh` once to register the MCP in Claude Code.
#
# Volume names below are pinned to ``claude-memory-data`` / ``claude-memory-ollama-models``
# for backward-compat — renaming would orphan existing user data. Will rename
# in v13 after a migration release with a built-in `docker volume rename` step.

x-memory-env: &memory-env
  TAM_MEMORY_DIR: /data
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  MEMORY_LLM_PROVIDER: ${MEMORY_LLM_PROVIDER:-ollama}
  MEMORY_LLM_API_BASE: ${MEMORY_LLM_API_BASE:-}
  MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-}
  MEMORY_VISION_MODEL: ${MEMORY_VISION_MODEL:-}
  MEMORY_LLM_ENABLED: ${MEMORY_LLM_ENABLED:-auto}
  MEMORY_EMBED_THREADS: ${MEMORY_EMBED_THREADS:-1}
  MEMORY_TORCH_THREADS: ${MEMORY_TORCH_THREADS:-1}
  USE_OLLAMA_EMBED: ${USE_OLLAMA_EMBED:-auto}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}

services:
  # ─────────────────────────────────────────────
  # Ollama — local LLM runtime
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: tam-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      # Exposed on loopback so host tools can also query it.
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # GPU passthrough (Linux only — uncomment if NVIDIA Container Toolkit is set up)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─────────────────────────────────────────────
  # Model pre-pull (one-shot)
  # ─────────────────────────────────────────────
  model-init:
    image: ollama/ollama:latest
    container_name: tam-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-qwen2.5-coder:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "→ Pulling ${MEMORY_LLM_MODEL:-qwen2.5-coder:7b}..."
        ollama pull "${MEMORY_LLM_MODEL:-qwen2.5-coder:7b}"
        echo "→ Pulling nomic-embed-text..."
        ollama pull nomic-embed-text
        echo "✓ Models ready."
    restart: "no"

  # ─────────────────────────────────────────────
  # MCP server (HTTP transport)
  # ─────────────────────────────────────────────
  # MCP server (Streamable HTTP transport, v12.4+)
  # ─────────────────────────────────────────────
  mcp:
    build: .
    image: total-agent-memory:latest
    container_name: tam-mcp
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    command: ["mcp"]
    environment:
      <<: *memory-env
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3737"
      # Server processes sharing the port. One process runs one tool call at
      # a time; raise this for several concurrent clients (sessions become
      # stateless). See docs/benchmarks/scale-v14/RESULTS.md.
      MCP_HTTP_WORKERS: ${TAM_MCP_WORKERS:-1}
    ports:
      - "127.0.0.1:3737:3737"
    volumes:
      - memory-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3737/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # Dashboard
  # ─────────────────────────────────────────────
  dashboard:
    image: total-agent-memory:latest
    container_name: tam-dashboard
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_started
    command: ["dashboard"]
    environment:
      <<: *memory-env
      DASHBOARD_PORT: "37737"
      DASHBOARD_BIND: 0.0.0.0
    ports:
      - "127.0.0.1:37737:37737"
    volumes:
      - memory-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:37737/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Reflection daemon — replaces LaunchAgent com.claude.memory.reflection
  # Watches /data/.reflect-pending and drains reflection queues
  # ─────────────────────────────────────────────
  reflection:
    image: total-agent-memory:latest
    container_name: tam-reflection
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_started
    command: ["reflection"]
    environment:
      <<: *memory-env
      REFLECT_DEBOUNCE_SEC: "5"
      REFLECT_INTERVAL_SEC: "3600"
      # Scheduled full (digest+synthesize) run - same 4x/day cadence as the
      # macOS/systemd calendar jobs (02/08/14/20), interval-based here since
      # Docker has no calendar scheduler. Independent of the auto/drain path.
      REFLECT_FULL_INTERVAL_SEC: "21600"
      MEMORY_FACT_MERGE_ENABLED: ${MEMORY_FACT_MERGE_ENABLED:-false}
    volumes:
      - memory-data:/data

  # ─────────────────────────────────────────────
  # Scheduler — orphan-backfill (4×/день) + check-updates (еженедельно)
  # Built into the main image (docker/scheduler_daemon.py), no external
  # cron container. v12.3 used mcuadros/ofelia + Docker socket; replaced
  # in v12.4 to keep the stack socket-less and simpler.
  # ─────────────────────────────────────────────
  scheduler:
    image: total-agent-memory:latest
    container_name: tam-scheduler
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_started
    command: ["scheduler"]
    environment:
      <<: *memory-env
    volumes:
      - memory-data:/data

volumes:
  memory-data:
    name: claude-memory-data
  ollama-models:
    name: claude-memory-ollama-models
